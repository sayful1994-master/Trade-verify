<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - The Commercial Bible</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-700 text-center">
        <h1 class="text-2xl font-bold mb-2 text-amber-400">The Commercial Bible</h1>
        <p class="text-sm text-slate-400 mb-6">Official Certificate Verification</p>

        <!-- Search Box (Manual Search Option) -->
        <div id="search-box" class="mb-6 flex gap-2">
            <input type="text" id="manual-cert-id" placeholder="Enter Certificate ID (e.g. TCB-1001)" 
                   class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-amber-400 text-sm"
                   onkeypress="if(event.key === 'Enter') handleManualSearch()">
            <button id="search-btn" onclick="handleManualSearch()"
                    class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg text-sm transition">
                Verify
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="text-slate-300 py-6 hidden">Verifying certificate, please wait...</div>

        <!-- Result Section -->
        <div id="result-container" class="hidden text-left space-y-4">
            <div class="bg-emerald-900/40 border border-emerald-500 text-emerald-300 p-3 rounded-lg text-center font-medium">
                ✅ Valid & Authentic Certificate
            </div>
            <div class="border-t border-slate-700 pt-4 space-y-2 text-sm">
                <p><span class="text-slate-400">Certificate ID:</span> <span id="cert-id" class="font-mono text-amber-300"></span></p>
                <p><span class="text-slate-400">Recipient Name:</span> <span id="cert-name" class="font-bold text-lg"></span></p>
                <p><span class="text-slate-400">Course Title:</span> <span id="cert-course" class="font-semibold text-blue-300"></span></p>
                <p><span class="text-slate-400">Issue Date:</span> <span id="cert-date"></span></p>
            </div>
        </div>

        <!-- Error Section -->
        <div id="error-container" class="hidden bg-rose-900/40 border border-rose-500 text-rose-300 p-4 rounded-lg">
            ❌ Invalid Certificate ID or Not Found in Database.
        </div>
    </div>

    <script>
        // ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyCShfO9N0vvw_wi4KIpB-fOXg0s4eJKrc",
            authDomain: "commercial-bible-app.firebaseapp.com",
            projectId: "commercial-bible-app",
            storageBucket: "commercial-bible-app.firebasestorage.app",
            messagingSenderId: "917248966117",
            appId: "1:917248966117:web:0ad16f2e84837dd021030c",
            measurementId: "G-G9P4EBEHY2"
        };

        // Firebase Initialize
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // প্রধান ভেরিফিকেশন ফাংশন
        async function verifyCertificate(targetId) {
            if (!targetId) return;

            const cleanId = targetId.trim();
            const loadingEl = document.getElementById('loading');
            const resultEl = document.getElementById('result-container');
            const errorEl = document.getElementById('error-container');

            loadingEl.classList.remove('hidden');
            resultEl.classList.add('hidden');
            errorEl.classList.add('hidden');

            try {
                // Firestore-এর 'certificates' কালেকশন থেকে অনুসন্ধান
                const docRef = await db.collection("certificates").doc(cleanId).get();
                
                loadingEl.classList.add('hidden');

                if (docRef.exists) {
                    const data = docRef.data();
                    document.getElementById('cert-id').innerText = data.certId || cleanId;
                    document.getElementById('cert-name').innerText = data.userName || "N/A";
                    document.getElementById('cert-course').innerText = data.courseTitle || "N/A";
                    document.getElementById('cert-date').innerText = data.issueDate || "N/A";
                    
                    resultEl.classList.remove('hidden');
                } else {
                    errorEl.classList.remove('hidden');
                    errorEl.innerText = `❌ No certificate found for ID: ${cleanId}`;
                }
            } catch (error) {
                console.error("Error fetching certificate:", error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                errorEl.innerText = "⚠️ Database connection error!";
            }
        }

        // ম্যানুয়ালি সার্চ বক্সে টাইপ করে ভেরিফাই করার ফাংশন
        function handleManualSearch() {
            const inputVal = document.getElementById('manual-cert-id').value;
            if (inputVal) {
                verifyCertificate(inputVal);
            }
        }

        // অটোমেটিক URL Parameter চেক করা (?id=TCB-2026-IMP-1001)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const certId = urlParams.get('id');
            if (certId) {
                document.getElementById('manual-cert-id').value = certId;
                verifyCertificate(certId);
            }
        });
    </script>
</body>
</html>
